<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>game time!</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-card">
    <header class="app-header">
      <h1>TYPE FOR TIME</h1>
      <p>click anywhere to begin typing!!</p>
    </header>

    <section class="telemetry-grid" aria-label="Live Typing Statistics">
      <div class="stat-card">
        <span class="stat-label">time</span>
        <span class="stat-value" id="time-display">60s</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">mistakes</span>
        <span class="stat-value" id="mistakes-display">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">WPM</span>
        <span class="stat-value" id="wpm-display">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">accuracy</span>
        <span class="stat-value" id="accuracy-display">100%</span>
      </div>
    </section>

    <section class="typing-area">
      <div id="quote-display" class="quote-box" aria-live="polite"></div>
      <textarea 
        id="quote-input" 
        class="quote-input" 
        rows="4" 
        placeholder="Click here and start typing to begin..."
        spellcheck="false" 
        autocomplete="off" 
        autocorrect="off" 
        autocapitalize="off"
      ></textarea>
    </section>

    <footer class="controls">
      <button id="restart-btn" class="btn-primary" type="button">RESTART TEST</button>
    </footer>
  </main>

  <dialog id="result-modal" class="result-modal">
    <div class="modal-content">
      <h2>GAME OVER</h2>
      <div class="modal-stats">
        <p>FINAL WPM: <strong id="final-wpm">0</strong></p>
        <p>ACCURACY: <strong id="final-acc">100%</strong></p>
        <p>MISTAKES: <strong id="final-mistakes">0</strong></p>
      </div>
      <button id="modal-restart-btn" class="btn-primary" type="button">PLAY AGAIN</button>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
